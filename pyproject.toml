[project]
name = "fraudops"
version = "1.0.0"
description = "Card-fraud detection on IEEE-CIS (590k transactions) with leakage-safe history features, a cost-based decision rule, an MLflow registry, per-prediction SHAP reasons, online/offline feature parity and drift monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "numpy>=2.0",
    "polars>=1.10",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=2.17",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.scripts]
fraudops = "fraudops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "shap>=0.46",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["fraudops"]
omit = ["*/fraudops/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
