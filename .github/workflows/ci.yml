name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # IEEE-CIS is behind Kaggle's competition rules, so CI runs every step on a synthetic
      # dataset with the same schema (src/fraudops/synth.py). Real numbers: docs/RESULTS.md.
      - name: Features, parity, models, registry, API, full pipeline
        run: uv run pytest --cov --cov-report=term --cov-fail-under=85
        env:
          FRAUDOPS_THREADS: 2
